briefings:
  themes:
    garden:
      - title: The entry cards blew away
        body: The show marquee was open at both ends when the wind found it, and the entry cards left in a hurry. The entries are still on their benches, magnificent and entirely anonymous. Judging starts at two and the rosettes have to go to the right benches.
      - title: A very thorough watering
        body: The sprinkler was set on a timer by somebody who does not trust timers, and so was also set off by hand. The paperwork was under the sprinkler. Every {noun} knows exactly what they grew and has firm opinions about everyone else’s.
      - title: The judge is new
        body: This year’s judge reorganised the benches for a better light, which was thoughtful, and did it before the cards were checked, which was not. Nobody doubts the measurements; nobody can say whose they are. The blue ribbon is not going anywhere until this is straightened out.

      - title: The entry cards went in the barrow
        body: Somebody cleared the trestle into the barrow to make room, and the barrow went where barrows go, which is the compost heap. The heap was turned that afternoon. The cards are in there somewhere and are no longer cards.
      - title: The secretary's beautiful ledger
        body: The show secretary keeps everything in one book in copperplate, has done for thirty years, and has never once mislaid it. It was in the car on Friday. The car went to be valeted on Saturday.
      - title: The marquee took off
        body: One corner came loose at about four in the morning and the wind did the rest, thoroughly, across two fields. The exhibits are fine, being heavy. The paperwork was not heavy.
      - title: Rain on an open trestle
        body: The forecast promised a dry afternoon and was wrong by roughly three hours. Everything laid out on the trestle took the lot. What is left of the list is a sheet of even grey.
      - title: The hose was left running
        body: It ran all night into the corner of the shed where the box of paperwork sits on the floor, as it has sat for years without incident. There were consequences this time. The box is now a solid cube of papier mache.
      - title: Two shows on one weekend
        body: The committee runs two events and keeps one set of forms, and this year the weekends overlapped by a day. Both sets of entries went onto the same sheets. Neither sheet says which show it was.
      - title: The pen ran out at number six
        body: It ran out cleanly and quietly, and the scoring carried on for another twenty minutes with nothing coming out at all. The impressions are still in the paper. Reading them wants a raking light and a great deal of patience.
      - title: A dog in the marquee
        body: It was in there for perhaps ten minutes, which is ample for a dog with an interest in paper and a low trestle to work from. The exhibits were untouched. The lists were not.
      - title: Filed on the burning heap
        body: There is a heap for burning and a heap for keeping, at opposite ends of the shed, and both of them are cardboard boxes. The fire was lit at six. It was an excellent fire.
      - title: The judge wrote on their hand
        body: Notes taken on a palm do not survive a watering can, and there was a watering can. Four marks remain and one of them is probably a number. It is being treated as a starting point.
      - title: A very windy Saturday
        body: The show is held outdoors, the show was well attended, and the wind was by common agreement a disgrace. Everything unweighted left at speed. The cards were unweighted.
      - title: The committee minuted nothing
        body: The judging was settled at a meeting everybody attended and nobody wrote up, because it was all perfectly obvious at the time. It is Monday now. Not one of them can put it back together.
      - title: Two hands, one list
        body: The list was kept by two people taking turns, in two hands, using two different abbreviations for the same thing. It reads as twice as many entries as there were. Untangling that is the morning's work.
      - title: The greenhouse in August
        body: The folder was left on the bench in the greenhouse over a hot weekend, which is a thing you only do once. The pages have gone the colour of weak tea and curled into tubes. Flattening them lifts the ink off.
      - title: Somebody tidied the shed
        body: The shed was cleared, swept and made beautiful by a volunteer who did not know what any of it was for. Everything went into black bags. The bags went out on Tuesday morning.
      - title: The rosettes were pinned early
        body: They went on ahead of time to save a job later, and then the order changed, which nobody minded until it emerged that the cards had already gone. The rosettes are on. Whether they are on the right benches is the question.
      - title: Something got into the box
        body: Whatever it was worked through a damp fortnight and a cardboard box in a more or less straight line. The trail is very clear. So are the holes it left behind.
      - title: The clipboard on the roof of the car
        body: It was put up there while the boot was opened and stayed put for the length of the village. It came off at the junction. Somebody is walking back along the verge with a carrier bag.
      - title: Written on the back of the schedule
        body: The tally went onto the reverse of the printed schedule, of which two hundred were made, all identical, all now stacked in the hall. Somewhere in that stack is the one with writing on it. Nobody has volunteered to go through them.
      - title: The tea urn went over
        body: It went over on the trestle at the back, which is exactly where the day's papers were, and it had been on since eight. What the water did not take, the tea did. The stain is even and complete.
      - title: Everyone remembers their own
        body: Every {noun} can tell you precisely what they entered and precisely nothing about anybody else's, which is natural and entirely useless. The answer lives in the overlap. There is not a great deal of overlap.
      - title: A gap in the numbering
        body: The entry numbers run from one to twenty-nine with no seventeen anywhere, and nobody will own up to seventeen. It is not blank, it is absent. Whoever took it out did it neatly.
      - title: Last year's cards, turned over
        body: The old cards were reused, which is thrifty and admirable, and now every card carries two sets of writing. Both are in the same hand. Neither is dated.
      - title: The lock on the hall
        body: Everything was shut in the hall for safekeeping on Saturday night, and the key holder went to visit family on Sunday morning. The hall is secure. It is secure until Thursday.
      - title: Somebody's shopping list
        body: The sheet on the trestle turned out to be a shopping list, and the real list turned out to be on something that has gone home in a coat pocket. The coat belongs to a visitor. Nobody caught a name.
      - title: The sprinkler is on a timer
        body: The timer works perfectly, which is the trouble, because nobody told it the marquee would be standing there this week. It came on at four in the morning. It ran for its usual twenty minutes.
      - title: Two people called Margaret
        body: There are two Margarets on the entry list and only one of them is written down with a surname. Half the entries are ambiguous on that basis alone. Both Margarets are being very good about it.
      - title: The frost got in
        body: The cold frame was left open, and the box of forms was in the cold frame, which is not where it lives and nobody has explained why it was. Paper, frost and then sun do a particular thing between them. The pages have gone to lace.
      - title: The photograph of the benches
        body: Somebody photographed the whole row rather than copying the cards out, which was clever, and the sun was behind the benches, which was not. The picture is a beautiful silhouette. Not one card can be read.
      - title: The show ran late
        body: Everything overran by two hours and the recording was the thing that got dropped, because it is always the thing that gets dropped. Every result was announced out loud to a field full of people. None of it was written down.
