briefings:
  themes:
    cosmic:
      - title: The manifest took a walk
        body: The only printed copy of the flight paperwork was being read on the observation deck when somebody demonstrated the airlock. It is now in a slow orbit of its own, along with the pen. Nothing leaves the pad until every line of it has been put back, and the window closes on Thursday.
      - title: Filed by committee
        body: Three departments each kept their own records so that nothing could possibly go missing, and each department has since misplaced a different half of theirs. Between them they are certain of everything except which {noun} is on which flight. The rockets are fuelled and the crews are being polite about it.
      - title: The computer was very confident
        body: The scheduling system reconciled the roster overnight, congratulated itself, and assigned every {noun} to the same berth on the same flight. It cannot be persuaded to explain how. The engineers are working from the crew room whiteboard and whatever anyone can swear to.
      - title: The tidy cycle ran early
        body: The housekeeping routine came round a day ahead of itself and treated everything pinned to the crew room board as debris. It was extremely efficient about it. What is left is a wall of drawing pins and five people who were each looking at a different part of it.
      - title: One magnet, one afternoon
        body: The backup drive spent an afternoon resting against the ring magnet in the machine shop, which is the one place it was never meant to be. It now reads as a very confident field of zeroes. The paper copy went out with the recycling the same day, because of course it did.
      - title: Three clocks, three answers
        body: The pad keeps local time, the control room keeps mission time, and somebody has been filing in whichever came to hand. Every entry is true at some hour of some day. Working out which is the difference between a roster and a list of guesses.
      - title: The pen that was not a pen
        body: Somebody borrowed what they took for a permanent marker, wrote up the whole board in it, and found out at the end of the shift that it had been the wipe-clean one all along. A sleeve went past. The board is spotless and the shift is not.
      - title: Approved by everyone, read by nobody
        body: The paperwork went round for five signatures and came back with five, which everyone agrees is excellent. Nobody can now find the version that was signed. Each {noun} remembers signing something slightly different.
      - title: The upgrade was seamless
        body: The records system was migrated overnight to something faster, cleaner and entirely empty. The old one has been decommissioned with an enthusiasm nobody asked for. Support say the data is definitely somewhere.
      - title: A very long weekend
        body: Nobody logged anything from Friday afternoon until Monday, on the reasonable grounds that nothing was meant to happen. Several things happened. They are now a matter of recollection rather than record.
      - title: The coffee reached the folder
        body: A full cup went over on the desk where the only complete copy was lying face up. Half the entries survived, and half of anything is worth nothing here. The pad wants the whole thing by the end of the week.
      - title: Filed correctly, somewhere
        body: The archive was reorganised by a system nobody wrote down, by somebody who has since gone on leave for a month. Everything is in it. Nothing is findable in it.
      - title: The radiation alarm was right
        body: A solar event went through the storage bay and left every drive in it with an opinion rather than a record. The shielded copy was in the unshielded rack, which is a sentence somebody is going to have to explain. What is left is people.
      - title: Two departments, one truth
        body: Scheduling and operations each keep their own list so that nothing can possibly be lost, and each has now lost a different half. Between them they are sure of everything except who is where. Neither will take the other's word for it.
      - title: The whiteboard was needed
        body: Somebody wanted a whiteboard for a meeting and found one already full, which they solved in the obvious way. The meeting went very well. The board had the only copy of the week on it.
      - title: Everything in the wrong hand
        body: The duty officer took notes on their left palm, which then opened a hatch, closed a hatch, and got washed. Four smudges remain and one of them may be a name. It is being treated as a starting point.
      - title: The label maker got ahead of itself
        body: Every folder in the bay was relabelled on Tuesday by somebody working from the wrong list. The contents did not move. The labels are now confidently wrong and the contents are anonymous.
      - title: Signed out and not back
        body: The master copy was signed out for a quiet read-through and has not been seen since, along with the person who signed for it. They are on the far side of a comms blackout until Thursday. The schedule waits for neither of them.
      - title: The backup backed up the backup
        body: Three copies were kept, on the sound principle that three is safe. All three turned out to point at the same file, which is now a single item of zero length. The principle is under review.
      - title: Handover by shrug
        body: The outgoing shift explained everything clearly to the incoming shift, who were mostly listening. The written version was going to be done afterwards. It was not done afterwards.
      - title: The director brought the dog in
        body: It was a small dog, it was a long afternoon, and the only bound copy was on the low shelf at exactly the right level. Everyone enjoyed the visit enormously. What survives is the cover and part of an index.
      - title: Two people, one name
        body: Half the entries use first names and half use call signs, and two of those turn out to belong to the same person. Untangling that took a morning and lost the rest of the day with it. Every {noun} is now being asked to state plainly who they are.
      - title: The room was clear of people
        body: Somebody vented the crew room to test a seal, having been told it was empty, which it was of anybody who could object. The paperwork could not object. It is a very tidy room now.
      - title: A generous reading of the word draft
        body: Someone found a folder marked draft and cleared it out, which is exactly what you are supposed to do with a folder marked draft. It was the only folder anybody had ever used. The naming convention is being looked at.
      - title: The scanner was on the wrong setting
        body: Every page went through at a quality suitable for a thumbnail, and the originals went into the bin standing behind the scanner. What came out is grey, confident and unreadable. Nobody checked the first page.
      - title: The meeting that settled it
        body: A meeting was called to sort out the record and sorted it out completely, in a conversation nobody minuted. Everybody left satisfied and went to lunch. Two days later not one of them can reproduce the argument.
      - title: Written on the back of something important
        body: The only version of the week was jotted on the reverse of a document that then did what documents do and went where it was meant to go. It is now correctly filed under something else entirely. Getting it back takes longer than starting again.
      - title: It did ask if I was sure
        body: It asked twice, which should have been a hint, and then did exactly what it was told with admirable speed. The undo button is decorative. Everything before Tuesday is a memory.
      - title: A gap in the numbering
        body: The entries jump from eleven to fourteen with no explanation, and nobody will admit to twelve or thirteen. The missing two are not blank, they are absent. Whoever removed them tidied up properly afterwards.
      - title: The rehearsal notes were the real notes
        body: The dry run was written up beautifully and the real thing was not, on the grounds that the real thing would obviously go the same way. It did not go the same way. The rehearsal is no help at all.
      - title: Everyone was somewhere else
        body: The one afternoon that needed writing up was the one afternoon the recording officer was called away, twice. Their notes stop mid-sentence. Everyone else was busy being the thing that needed recording.
      - title: The heater was under the shelf
        body: A heater was left running under the low shelf for a fortnight, and the low shelf is where the ring binders live. The pages are intact, brown, and stuck together in one solid block. Steaming them apart is going slowly.
      - title: Nobody is in trouble
        body: That is what the notice on the door says, which everybody agrees is a strange thing for a notice to say. Behind the door is the store cupboard that used to be the records room. How it became a store cupboard has several versions.
