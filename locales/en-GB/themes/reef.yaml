briefings:
  themes:
    reef:
      - title: The dive log went for a dive
        body: The log was on the transom, and then the swell was on the transom, and now the log is somewhere between the boat and the sea floor. Everyone surfaced happy and nobody wrote anything down. The permit needs the day’s numbers filed by Friday or the whole trip goes unrecorded.
      - title: Everything came off one line
        body: Somebody rinsed everything at once, hung it on one line, and left it to the wind to decide whose was whose. Every {noun} is certain what they saw and vague about what they wore. The insurance form asks for both.
      - title: The tender was rewriting history
        body: The boat tender kept the day’s notes on their hand, which then met a wave, sun cream and a towel in that order. What is left is four smudges and one word that might be "eel". The dive centre would like a version to pin on the board.
      - title: The slate went over the side
        body: The day was written up on the slate on the way back in, and the slate was set down on the gunwale while somebody coiled a line. The sea took it cleanly. Nobody saw it go.
      - title: The compressor room flooded
        body: A hose let go overnight in the room where the day's paperwork is pinned to a board at knee level. The board is fine. The paper on it has become one grey sheet.
      - title: Everything went in the rinse tank
        body: The tank takes everything at the end of a day, on the sound principle that fresh water fixes most things. It does not fix a notebook. The notebook was in a pocket of the first thing in.
      - title: The skipper's excellent memory
        body: The skipper writes nothing down until the evening and has never once been wrong, which is why nobody insists on it. This evening the skipper was called to the harbour office. They came back at midnight with an apology.
      - title: Two boats, one logbook
        body: The centre runs two boats and keeps one book, which works beautifully until both boats are out on the same morning. Both crews wrote in it. Neither crew wrote down which boat they were on.
      - title: The sun took the ink
        body: The book spent an afternoon face up on the wheelhouse roof in flat calm and full sun. It is a lovely colour now. The pages are exactly the same lovely colour as the writing.
      - title: Salt, and then time
        body: The book lives in a bag inside a locker, and the locker has been letting in a fine mist of salt for longer than anybody noticed. The pages are stiff and pale. They crack rather than turn.
      - title: The permit office wants it Friday
        body: They are not unreasonable people and they have been extremely clear about the date. What they want is the day's numbers, in order, signed. What there is instead is eight people and a lot of good will.
      - title: A pen that does not like water
        body: Somebody brought the wrong pen aboard, and it wrote beautifully all morning and dissolved in the afternoon. The morning half is perfect. The afternoon half is a blue cloud.
      - title: The clipboard blew off the flybridge
        body: It went over on the run home in a following wind, spun once, and landed somewhere in the wake. Two pages were still attached when it went. The rest had left earlier and separately.
      - title: The phone that had the whole week
        body: One phone held everything, in a case rated to ten metres, which is a number that quietly assumes the case is shut. It was not shut. It is now an expensive paperweight.
      - title: A very thorough tidy
        body: Somebody cleared the wheelhouse before the inspection, which was the right instinct, into a bin bag, which was not. The bag went to the skip that evening. The skip was emptied at six.
      - title: The briefing was given out loud
        body: The morning run-through was delivered clearly, to everybody, and written down by nobody, because it has never once needed writing down. Today it needed writing down. Eight people heard eight slightly different mornings.
      - title: The book was lent out
        body: Another boat borrowed it to copy a page and has not brought it back, being two days up the coast and in no particular hurry. They are perfectly reliable people. They are also out of range.
      - title: A squall on the way in
        body: It came through fast and everybody did the sensible thing, which meant securing anything loose without stopping to ask what was paper. Two things went over the side. One of them mattered.
      - title: The new system is better
        body: The centre has moved to filling in a form on a laptop, which is better in every way, and the laptop stayed ashore this morning. The paper book was retired last week. Nothing at all was written down.
      - title: Filed under the coffee cup
        body: The page spent an afternoon under a cup on the galley counter, in a boat that moves. The ring is perfect. What was inside the ring is not.
      - title: Everybody checked everybody
        body: The buddy system means every pair signed for each other, which is excellent practice and produces a page of pairs with nothing else on it. Who went with whom is beyond doubt. Nothing else is.
      - title: The pencil was the only casualty
        body: The board survived and the clip survived, and the pencil went in the water first thing and was not missed until the end of the day. Nobody wanted to be the one to mention it. Everything since breakfast is memory.
      - title: Two people, one first name
        body: Half the entries use first names and two of the eight aboard share one, which was funny in the morning. It stopped being funny at the desk. Four entries could belong to either of them.
      - title: The pages stuck together
        body: A wet thumb, a warm locker and three days will laminate a notebook as well as any machine. The block is intact and will not open. Prising it apart takes the pages with it.
      - title: The harbour master borrowed it
        body: He wanted to check one number and took the whole book to his office so he could do it properly. The office was locked at four. He is away until the middle of next week.
      - title: A gull took the corner of it
        body: It came down on the transom for something else entirely and left with a corner of the day, which is the corner the times were written in. The gull is fine. The book is missing a triangle.
      - title: Written on the back of a form
        body: The day went onto the reverse of a form that gets handed in, signed and filed at the end of every trip. It was handed in, signed and filed. It is now three boxes deep in a cupboard ashore.
      - title: The boat was hosed down
        body: End of the season, everything out, everything hosed, which is exactly the procedure. The procedure assumes the paperwork has already been taken off. It had not been taken off.
      - title: Nobody was aboard
        body: Everyone was in the water at the same time, which is not supposed to happen and did, and the boat sat quietly with the book open on the bench. It was a breezy afternoon. Several pages are somewhere in the bay.
      - title: The order of the morning
        body: Everybody agrees on who went in and nobody agrees on the order, and the order is the one thing the form actually asks for. Each {noun} is certain they were after somebody else. They cannot all have been last.
      - title: Two versions in one book
        body: Somebody started writing the day up from the back of the book, which is a perfectly good system as long as everybody knows about it. Nobody else knew about it. The two halves meet in the middle and disagree.
      - title: The centre keeps a large dog
        body: It was left aboard for an hour, and there was a bag on the bench that smelled extremely interesting to a large dog. The bag is in pieces. So is the afternoon.
      - title: Left on the roof of the van
        body: The book was put on the roof while the doors were unlocked and stayed up there for about a mile of coast road. It came off on the first proper bend. Somebody has gone back to walk the verge.
