    difficulty: Beginner
    label: 3 × 3
  sm:
    difficulty: Advanced
    label: 4 × 4
  md:
    difficulty: Expert
    label: 5 × 4
  lg:
    difficulty: Pro
    label: 6 × 4

# The colours the app can be drawn in.
accents:
  blue: Blue
  violet: Violet
  teal: Teal
  green: Green
  rust: Rust

# The four steps of the volume slider.
volumes:
  off: 'Off'
  quiet: Quiet
  medium: Medium
  loud: Loud

# What each puzzle theme is called, and the line under it. The cast, their
# one-line descriptions and their traits are still in src/data/themes.ts — see
# the note at the top of this file.
themes:
  cosmic:
    name: Cosmic Voyage
    blurb: Crews, ships and launch windows
  cafe:
    name: Corner Café
    blurb: Regulars, orders and the morning rush
  quest:
    name: Mythic Quest
    blurb: Heroes, beasts and hard-won gold
  reef:
    name: Reef Dive
    blurb: Divers, sightings and depth logs
  garden:
    name: Blue Ribbon Garden
    blurb: Growers, blooms and show-day heights
