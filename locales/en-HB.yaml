          suri:
            label: 'Suri'
            blurb: 'Wins every weightless card game and will not say how.'
            traits:
              hair: 'black'
              eyes: 'hazel'
              sign: 'Capricorn'
          dax:
            label: 'Dax'
            blurb: 'Named the coffee machine and now takes its side in disputes.'
            traits:
