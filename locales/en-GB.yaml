    difficulty: Beginner
    label: 3 × 3
  sm:
    difficulty: Advanced
    label: 4 × 4
  md:
    difficulty: Expert
    label: 5 × 4
  lg:
    difficulty: Pro
    label: 6 × 4

# The colours the app can be drawn in.
accents:
  blue: Blue
  violet: Violet
  teal: Teal
  green: Green
  rust: Rust

# The four steps of the volume slider.
volumes:
  off: 'Off'
  quiet: Quiet
  medium: Medium
  loud: Loud

# The themes: every word of every cast.
#
# `src/data/themes.ts` holds the skeleton — which sets a theme plays with, which
# items are in them, in what order, and the numbers the ordered ones compare by.
# Everything readable is here, keyed by the item's id.
#
# An id (`nova`, `seed-vault`) is not language: it names the item's drawing in
# assets/icons, and a test checks the two agree. Change a `label` freely; leave
# the key alone.
#
# `pattern` and `describes` are the fragments a clue is built from — `{}` is
# where the item's own name goes. A trait's `pattern` uses `{noun}` for what one
# member of the set is called and `{}` for the value, so "astronaut with red
# hair" is one template and one word. `clues` gives a theme its own sentences;
# anything it leaves out falls back to the neutral wording in
# src/puzzle/describe.ts.
themes:
  cosmic:
    name: 'Cosmic Voyage'
    blurb: 'Crews, ships and launch windows'
    clues:
      link: '{a} shares a mission with {b}.'
      notLink: '{a} does not share a mission with {b}.'
      groupNot: 'No {a} shares a mission with {b}.'
      either: '{a} shares a mission with either {b} or {c}.'
      compare: '{greater} launches {comparative} than {lesser}.'
      compareGap: '{greater} launches exactly {gap} {unit} {comparative} than {lesser}.'
    categories:
      astronaut:
