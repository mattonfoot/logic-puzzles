solved:
  title: Solved!
  # "Pure advanced · Puzzle 7", or "Daily beginner · 2 September 2026".
  #
  # The theme and the grid size stood here, and neither says which game this
  # was: the theme's own drawing is right above the line and its cast is in the
  # answer table under it, and the shape is that table's shape. What the game
  # was called and which one of them it was is what somebody comparing two
  # finishes needs, and the name is the one the board carried.
  subtitle: '{game} · {which}'
  # Which one off the list. The name beside it already says how it was played,
  # so this is only the number. A daily names its date instead — there is one a
  # day at each difficulty, and no choice to name.
  numbered: 'Puzzle {number}'
  time: Time
  cluesRead: Clues read
  # Beside the clues, and only on a game that counted them: how many times the
  # player asked a clue what was wrong with the board. A clue read is a puzzle
  # met halfway; a hint asked for is the app doing a step of it.
  hintsAsked: Hints asked
  answer: The answer
  swipe: Swipe the table for the other sets
  share: Share
  # Beside Share: the same puzzle again, from a blank board and a zeroed clock.
  playAgain: Play again
  # Under the result, when the history could not be written.
  notRecorded: This game could not be recorded — the device may be out of space.

# A finished game as a few lines to send somebody. No spoilers: the third line
# is the clues read as squares, which the app writes for itself.
share:
  # "Deduction · Daily beginner · 2 September 2026". The game is named the way
  # the board that was played is titled, so a time sent to somebody and the
  # screen it was set on agree about what the game was called.
  daily: 'Deduction · {game} · {date}'
  # "Deduction · Pure advanced #7". The name carries which of the three ways it
  # was played as well as how hard it was: the same number is a different puzzle
  # on each side, so a time without it is a time nobody can answer.
  numbered: 'Deduction · {game} #{number}'
  # The second line is the clock and what it cost, joined by the middot the app
  # punctuates with everywhere. Hints are left off a game that used none: a
  # nought on every share says nothing, and their absence is the good news.
  clues:
    one: 1 clue
    other: '{count} clues'
  hints:
    one: 1 hint
    other: '{count} hints'

# The note under a finish. Every one of these measures the game against the
# player's earlier games at the same difficulty *and* played the same way, so
# each names the game the way the board did — "First Pure advanced in the
# books". A difficulty on its own would claim a best across two different jobs.
improvement:
  revealed:
    headline: Solution revealed
    detail: Revealed puzzles are kept out of your times.
  first:
    headline: First {game} in the books
    detail: 'Time to beat next round: {clock}{clues}.'
  best:
    headline: New {game} best!
    detail: '{gap} faster than your old best of {best}{clues}.'
  faster:
    headline: '{percent}% faster than your {game} average'
    detail: '#{rank} of {total} · best is {best}{clues}.'
  steady:
    headline: '{game} complete'
    detail: '{gap} off your best of {best}{clues}.'
  # Tacked onto the end of a detail line above.
  clues:
    one: ' · 1 clue read'
    other: ' · {count} clues read'

stats:
  title: Statistics
  # Under the heading, when there is a history on the device the app cannot read.
  unreadable: The finished games on this device could not be read, so nothing from before today is counted.
  solved: Solved
  timePlayed: Time played
  streak: Streak
  bestStreak: best {days}d
  cluesRead: Clues read
  # Under the clues, where it used to be a tile of its own. It is a reading of
  # that number rather than a number beside it, and folding it in left room for
  # the hints without a row holding one tile.
  perPuzzle: '{count} per puzzle'
  hintsAsked: Hints asked
  themes: Themes
  byDifficulty: By difficulty
  difficulty: Difficulty
  best: Best
  average: Average
  gettingFaster: Are you getting faster?
  # Over the chart: which games these times are, named as the board named them.
  chartCaption: '{game}: recent solve times, one column per puzzle'
  fasterLately: '{percent}% faster lately'
  slowerLately: '{percent}% slower lately'
  holdingSteady: Holding steady
  empty: No finished puzzles yet
  emptyBody: Solve one and your time lands here. After a few, you will see whether you are getting quicker.
  clearStatistics: Clear statistics
  # Where the chart would be, with only one time to draw.
  trendEmpty: One more {game} solve and the trend shows up here.
  trendPending: '{solved} solved · best {best}. A few more and the trend below fills in.'
  trendDetail: Last {count} average {recent} vs {earlier} before that.
  confirm:
    title: Clear statistics?
    body: This deletes every finished game and all your times. It cannot be undone.
    confirmLabel: Clear statistics
    cancelLabel: Keep them
  back: Back

# The four shapes a puzzle comes in. `label` is how the grid reads and is
# arithmetic rather than language; `difficulty` is what it is called.
# The five boards, smallest first. The label is the shape as the grid reads it:
# how many of each set, then how many sets.
# The cards at the foot of the statistics: what a player has actually done, one
# card each. Nothing is listed until it has been earned — a page of locked rows
# is a chore list, and the app counts nothing at anybody.
achievements:
  title: Achievements
  # The count is the card's own title, so the four tiers are one line apiece
  # with the thing being counted dropped in: "First classic game", "Ten dailies".
  count:
    one: First {one}
    three: Three {many}
    ten: Ten {many}
    hundred: A hundred {many}
  all:
    one: puzzle
    many: puzzles
    body: Any puzzle at all counts here, whichever way it was played.
  kinds:
    pure:
      one: pure game
      many: pure games
      body: 'Pure Deduction: the board keeps the bookkeeping.'
    classic:
      one: classic game
      many: classic games
      body: 'Classic logic: every mark on the board is yours.'
    daily:
      one: daily
      many: dailies
      body: The day's challenge, handed out rather than chosen.
  # A difficulty never counts on its own: an Expert board the hard way is not the
  # same game as an Expert board with the bookkeeping done for you. So the pair
  # is counted under the name the board itself carried — "Classic expert".
  pair:
    one: '{game} puzzle'
    many: '{game} puzzles'
    body: '{game} boards.'
  # Coming back.
  streak:
    three:
      title: Three days running
      body: A puzzle finished on three days in a row.
    week:
      title: A week running
      body: Seven days in a row.
    month:
      title: A month running
      body: Thirty days in a row.
    hundred:
      title: A hundred days running
      body: A hundred days in a row, which is a habit rather than a run.
  dailyStreak:
    week:
      title: A week of dailies
      body: The day's challenge done on the day itself, seven days in a row.
    month:
      title: A month of dailies
      body: Thirty days in a row.
  sweep:
    title: Clean sweep
    body: All five of one day's challenges, on the day.
  back:
    title: Back again
    body: A puzzle finished after a week or more away. Nothing is lost by stopping.
  # Getting around.
  ladder:
    pure:
      title: The full ladder
      body: All five difficulties finished in Pure Deduction.
    classic:
      title: The ladder, the hard way
      body: All five difficulties finished in Classic logic.
    day:
      title: Ladder in a day
      body: All five difficulties in one day, however each of them was played.
  bothHands:
    title: Both hands
    body: A Pure Deduction game and a Classic logic one.
  allThree:
    title: All three
    body: A pure game, a classic game and a daily, in one day.
  themes:
    title: Met everybody
    body: A puzzle finished in each of the five themes.
  run:
    ten:
      title: Working through it
      body: Puzzles 1 to 10 at one difficulty, all finished, all played the same way.
    group:
      title: A full group
      body: Puzzles 1 to 25 — one row of the zoomed-out list, filled in.
  # Unaided.
  unaided:
    one:
      title: Unaided
      body: A puzzle finished without asking for a hint.
    ten:
      title: Ten unaided
      body: Ten of them.
    hundred:
      title: A hundred unaided
      body: A hundred of them.
    row:
      title: Ten in a row
      body: Ten finished one after another without a hint between them.
    legend:
      title: Legend, unaided
      body: A 5 × 5 finished without a hint, with the board keeping up.
    legendClassic:
      title: Legend unaided, the hard way
      body: The same board with nothing worked out for you, and still no hint.
  # The clock. A daily has no speed card: it is played with whatever settings
  # the player keeps, so one person's Legend is not another's.
  speed:
    pure:
      xs:
        title: Under the minute
        body: A Beginner finished inside 1:00.
      sm:
        title: Under three
        body: An Advanced finished inside 3:00.
      md:
        title: Under five
        body: An Expert finished inside 5:00.
      lg:
        title: Under eight
        body: A Pro finished inside 8:00.
      xl:
        title: Under fifteen
        body: A Legend finished inside 15:00.
    classic:
      xs:
        title: Beginner, the hard way
        body: A Beginner inside 2:00, with nothing worked out for you.
      sm:
        title: Advanced, the hard way
        body: An Advanced inside 5:00, with nothing worked out for you.
      md:
        title: Expert, the hard way
        body: An Expert inside 9:00, with nothing worked out for you.
      lg:
        title: Pro, the hard way
        body: A Pro inside 14:00, with nothing worked out for you.
      xl:
        title: Legend, the hard way
        body: A Legend inside 25:00, with nothing worked out for you.
  quarterOff:
    title: A quarter off
    body: Beat your own best by a quarter or more, at that difficulty played that way.
  early:
    title: Early shift
    body: A puzzle finished before seven in the morning.
  night:
    title: Night shift
    body: One finished between midnight and four.
  played:
    hour:
      title: An hour in
      body: An hour of puzzles, all told.
    tenHours:
      title: Ten hours in
      body: Ten hours.
    day:
      title: A day in
      body: Twenty-four hours of them.
  # What the board measures about how it was solved.
  clean:
    title: Clean board
    body: Finished without taking a single mark back.
  neverWrong:
    title: Never wrong
    body: Finished without the board ever contradicting itself.
  rewound:
    title: Rewound and recovered
    body: Finished a board that had to be wound back.
  manual:
    title: Read the manual
    body: Every lesson behind How to play, walked to the end.
  slept:
    title: Slept on it
    body: A puzzle put down one day and finished the next.
  oneSitting:
    title: One sitting
    body: A Classic Legend finished without once leaving the board.

