# Deduction — en-GB
#
# Every word the app says, in one file. Change the wording here and run
# `npm run locale`; that rewrites src/i18n/strings.generated.ts, which is what
# the app actually imports, and a test fails if the two are ever out of step.
#
# Placeholders are {braced} and are filled in by the code that reads the string,
# so the words either side of one can be reordered freely — which is the point
# of them, and the first thing another language will want to do.
#
# Anything ending in `.one` / `.other` is a count: `.one` is used when the number
# is exactly one and `.other` for everything else, including zero.
#
# What is NOT here: the puzzle themes' item names, their one-line blurbs and
# their trait values, which are still in src/data/themes.ts. An item's name is
# load-bearing as well as readable — the file name of its drawing is derived
# from it, and a test enforces that — so translating those means decoupling the
# icon naming first. Everything the interface says, and every word of the
# narrative around a puzzle, is here.

app:
  # The name is the last line of the sentence above it, so the two are written
  # as a pair: "One solution, never guessed, pure…" then "…Deduction".
  name: '…Deduction'
  tagline: One solution, never guessed, pure…

common:
  back: Back
  close: Close
  next: Next
  previous: Previous
  # Under a window, saying how to be rid of it.
  tapOutside: Tap outside to close
  # "3 of 8" — a position in a run, used by the item card and the clue window.
  position: '{at} of {total}'
  building: Building your puzzle…
  keepIt: Keep it

# The page the app falls back to when a screen throws while drawing. Two ways
# on: back to the front door with everything kept, or the same with the saved
# game thrown away - the escape hatch for a save that breaks the board every
# time it is opened.
crash:
  title: Something went wrong
  body: The screen could not be drawn. Nothing you have finished is lost. If this keeps happening when a puzzle opens, the saved game may be the cause, and throwing it away will clear it.
  home: Back to the start
  discard: Discard the saved game
  # Printed small under the buttons, for a bug report.
  detail: 'The error was: {message}'

start:
  daily: Daily
  play: Play
  # Under Play, for somebody who has never met a logic grid.
  howToPlay: How to play
  settings: Settings
  statistics: Statistics

# The lessons behind "How to play": real grids, walked mark by mark.
#
# Two menus. The first holds the two that teach deduction itself and a way
# through to the second, which holds one lesson per kind of clue.
lessons:
  title: How to play
  back: Back
  # Under the puzzle's name in the header: how far through the walk you are.
  step: Step {at} of {total}
  # The last line of the window a lesson opens on, in the frame a puzzle's own
  # story opens in. Nothing happens until the player asks for it.
  begin: When you are ready to start the tutorial, hit the Clue button.
  # Under every instruction, so the way on is never in doubt.
  whenDone: Hit the Clue button again when you are done.
  # Over the clue a step follows from, where a puzzle's clue window says who is
  # supposed to have said it.
  clue: The clue
  # And over what to do about it.
  saying: What to do
  # The line while there is board left and no step left to read.
  finish: 'Nothing left to read. Finish it.'
  # Once the board is out.
  solved: 'Solved. Every puzzle in the app is that, on a bigger board with more to hold in your head.'
  # What the Clue button finds when the board is not what the step asked for.
  # A real puzzle keeps this to itself until a clue cannot help; a lesson is
  # asked directly, and answers.
  check:
    # A square, by the two things it names: "Ms Barley and the Mocha".
    square: '{row} and {column}'
    # Joining two or three of them: "A, B and C".
    listLast: '{first} and {last}'
    # Pressed with the square still empty.
    blank: 'Nothing on {square} yet — that is the square this one is about.'
    # Asked for a tick, found a cross.
    crossed: '{square} is crossed out, and this one is a pair. Tap it once more to bring the cross round to a tick, or hold the square down.'
    # Asked for a cross, found a tick.
    ticked: '{square} is ticked, and nothing here says those two go together. Tap it twice to bring the tick round to a cross.'
    # Marks anywhere on the board that contradict the answer.
    wrong:
      one: '{squares} cannot be right, so the board has shaded it. Tap it round until it clears, then hit Clue again.'
      other: '{squares} cannot be right, so the board has shaded them. Tap each round until it clears, then hit Clue again.'
    # Pressed with the last square still open and nothing wrong on the board.
    unfinished: 'Not out yet — there is still a square with nothing in it, and everything you need to fill it is on the board.'
  confirm:
    title: Leave the lesson?
    body: There is nothing to save here, so it starts from the beginning next time.
    confirmLabel: Leave it
    cancelLabel: Keep going
  # The three on the first menu.
  deduction:
    title: Using deduction
    blurb: Two clues, three pairs, and the one you are left to find
    opening: 'Three customers, three drinks. Each ordered one, and no two ordered the same. Every square asks the same question: do these two go together?'
    steps:
      one: 'Tap where Ms Barley meets the mocha twice: once for a cross, again for a tick.'
      oneDone: A tick settles a whole row and a whole column. Barley ordered nothing else, and nobody else ordered the mocha — so the board crossed those off for you, lightly, to tell them from your own. Holding a square down is the same thing in one go, whatever it had on it.
      two: Now the same for Alderman Crumb and the chai. Two taps.
      twoDone: Two clues, two pairs, and every square they touch is now spoken for.
    finish: One square left, and no clue for it. That is the game — finish it.
  further:
    title: Further deduction
    blurb: Three sets, and the pairs that follow from the pairs
    opening: 'Three customers, three drinks, three pastries. Three grids now, and a pair found in one of them says something about the others.'
    steps:
      drink: 'Ms Barley and the mocha. Two taps for a tick.'
      drinkDone: One pair down.
      pastry: Now Ms Barley and the croissant, on the grid below.
      pastryDone: Barley has the mocha and Barley has the croissant.
      carry: 'So the mocha and the croissant are on the same ticket as each other. Find them on the drinks-and-pastries grid and tick them.'
      carryDone: That is the idea this board is for. A pair never stays on one grid.
      crumbDrink: Alderman Crumb and the chai.
      crumbDrinkDone: Same again.
      crumbPastry: And Alderman Crumb and the cannelé.
      crumbPastryDone: Which settles one more square without a clue for it.
      crumbCarry: The chai and the cannelé, then.
      crumbCarryDone: Two of the three customers are done, which leaves Mrs Marzipan with what nobody else took.
      lastDrink: Mrs Marzipan and the latte.
      lastDrinkDone: Nothing else was left in that grid.
      lastPastry: And Mrs Marzipan and the scone.
      lastPastryDone: Every customer is settled, and one square is not.
    finish: One square left, on the grid with no customers on it. You have everything you need for it.
  clues:
    title: Understanding clues
    blurb: One lesson for each kind of clue the game writes
    # The second menu's own heading and way back.
    back: Back
  # The five behind "Understanding clues".
  negative:
    title: Negative clues
    blurb: What a clue rules out is as good as what it settles
    opening: 'Some clues only say no. They are worth as much as the others: rule two drinks out of a row and the third one is settled without anybody saying so.'
    steps:
      one: Tap where Ms Barley meets the latte once, for a cross.
      oneDone: Ruled out.
      two: And once where she meets the chai.
      twoDone: Two of Barley's three drinks are crossed off, and she ordered one of them.
      three: 'So the mocha is hers. Tap it twice.'
      threeDone: A no and a no made a yes. That is what negative clues are for.
      four: Now cross off Alderman Crumb and the latte.
      fourDone: Crumb has no latte, and no mocha either — the tick above crossed that off for you.
      five: 'Which leaves the chai. Two taps.'
      fiveDone: Two of Crumb's three drinks were crossed off, so the third had to be his — the same shape of thinking as before, one clue lighter.
    finish: And that settles the last square without a word about it.
  comparison:
    title: Comparison clues
    blurb: Higher and lower, and the ends they rule out
    opening: 'Three customers and three bills. A comparison never names a bill: it says one is above another, and the work is in what that makes impossible.'
    steps:
      one: 'Barley is above Crumb, so she is not the lowest. Cross off Ms Barley and $4.'
      oneDone: The one at the bottom cannot be above anybody.
      two: 'And the same the other way: Crumb is below her, so he is not the highest. Cross off Alderman Crumb and $6.'
      twoDone: One clue, two squares, and neither of them named a number.
      three: 'The second clue puts Marzipan above Barley, so she is not the lowest either. Cross off Mrs Marzipan and $4.'
      threeDone: 'Which leaves one customer in the $4 column.'
      four: 'Tick Alderman Crumb and $4.'
      fourDone: Settled.
      five: 'Barley is below Marzipan, so Barley is not the highest. Cross off Ms Barley and $6.'
      fiveDone: 'And Barley has nowhere left but the middle.'
      six: 'Tick Ms Barley and $5.'
      sixDone: Two customers placed, and neither clue ever named a number.
    finish: Which leaves the highest bill for the one customer with nothing crossed off.
  grouped:
    title: Grouped clues
    blurb: One sentence that rules out several people at once
    opening: 'A clue can describe people instead of naming them — "no customer with spectacles" — and then it is about everybody the description fits. Tap a customer''s picture to see what is true of them; that is where the descriptions come from.'
    steps:
      one: 'Two customers wear spectacles: Ms Barley and Dr Frangipane. Cross Ms Barley off the latte.'
      oneDone: One of the two.
      two: And Dr Frangipane off the latte as well.
      twoDone: 'One sentence, two squares. That is what a group clue buys you.'
      three: 'Which leaves one customer for the latte. Tick Miss Custard and the latte.'
      threeDone: 'And her tick crossed off her other two drinks.'
      four: 'The second clue is about green eyes. Barley and Custard have them — Custard is already settled, so cross Ms Barley off the mocha.'
      fourDone: 'Barley has no latte and no mocha.'
      five: 'So the chai is hers. Two taps.'
      fiveDone: Two sentences, two descriptions, and five of the nine squares settled by them.
    finish: Which leaves one drink for the one customer still open.
  gap:
    title: Compare the gap clues
    blurb: An exact difference, and the pairs it allows
    opening: 'This one gives the exact difference. Read the numbers on the bills first — $4, $5 and $7 — because the clue is really a question about which two of them are that far apart.'
    steps:
      one: 'Barley is a dollar above Crumb, so she is not the lowest. Cross off Ms Barley and $4.'
      oneDone: 'That much is the ordinary comparison.'
      two: 'Now the gap. $7 is two dollars above $5 and three above $4, so no bill sits exactly a dollar below it. Cross off Ms Barley and $7.'
      twoDone: 'The exact difference ruled out a square that a plain "higher than" never could.'
      three: 'Which leaves the middle. Tick Ms Barley and $5.'
      threeDone: 'And a dollar below $5 is $4, which is where Crumb has to be.'
      four: 'So cross off Alderman Crumb and $7.'
      fourDone: 'Leaving him one bill.'
      five: 'Tick Alderman Crumb and $4.'
      fiveDone: One clue did all of that, which is why an exact gap is the strongest sentence the game writes.
    finish: And the last bill goes to the last customer.
  vague:
    title: Vague clues
    blurb: Two options named, and the one that is not
    opening: 'A clue that offers two options looks like it settles nothing. Read it the other way round: the drink it does not name is the one it rules out.'
    steps:
      one: 'The first clue offers Barley the latte or the mocha. It does not offer the chai — so cross off Ms Barley and the chai.'
      oneDone: 'What a vague clue is worth is the option it left out.'
      two: 'The second offers her the mocha or the chai. Cross off Ms Barley and the latte.'
      twoDone: 'Two vague clues, and the only drink both of them offered was the mocha.'
      three: 'So it is hers. Two taps.'
      threeDone: 'Two maybes made a certainty.'
      four: 'The last clue offers Crumb the latte or the mocha. Cross off Alderman Crumb and the chai.'
      fourDone: 'And the mocha went to Barley, so it was crossed off him already.'
      five: 'Which leaves the latte. Tick it.'
      fiveDone: Three clues that each offered a choice, and not one square left in doubt.
    finish: And the customer nobody has settled takes the drink nobody has taken.

setup:
  title: Play
  continue: Continue
  # Read out for Continue: what is waiting behind it.
  continueHint: '{theme}, {size}, {percent}% filled in, {clock} on the clock'
  # In Continue's place, when there is a saved game the app cannot read.
  unreadable: A saved game was found but could not be read. Choosing a difficulty replaces it.
  # Read out for a difficulty: the shape it stands for.
  difficultyHint: '{items} items in each of {sets} sets'
  back: Back

numbers:
  # The heading over the numbered list: "Play Expert".
  title: Play {difficulty}
  # Every row of it.
  puzzle: Puzzle {number}
  finishedHint: Finished in {clock}
  # The button between Previous and Next: out to the pages of pages.
  zoomOut: Zoom out
  # A row when zoomed out: the run of puzzles it stands for.
  group: Puzzles {first}–{last}
  groupDone: '{done} of {total} finished'
  groupHint: Opens the pages in this group
  back: Back to the difficulties

daily:
  title: Daily challenges
  doneHint: Done in {clock} — opens the result
  # Under the heading, only once there is one to speak of.
  streak:
    one: 1 day running
    other: '{count} days running'
  back: Back

game:
  # Offered on every square in the rotor, since a long press is a gesture a
  # screen reader has no way of making.
  settle: Tick it
  menu: Menu
  undo: Undo
  clue: Clue
  info: Info
  highlight: Highlight
  zoomIn: Zoom in
  zoomOut: Zoom out
  back: Back to setup
  # The seed, under the puzzle's name.
  seed: '#{seed}'
  status:
    nothingToUndo: Nothing to undo.
    # A tap on a square before the first clue is read. The board takes no marks
    # yet, and saying why is cheaper than leaving the buzz to be read as a bug.
    nothingToGoOn: Nothing to go on yet — tap Clue for the first one.
    finished: This puzzle is finished — Restart to play it again.
    restarted: Restarted — same puzzle, fresh board and clock.
    # Said once, the first time a save fails: the game plays on, but will not
    # be waiting behind Continue.
    notSaving: Progress is not being saved — the device may be out of space.
    clearedMistakes: Took off the marks that cannot be right.
    rewound:
      one: Rewound {steps} move to a board that can still be solved.
      other: Rewound {steps} moves to a board that can still be solved.
  # The window that opens when the answer has been marked away.
  stuck:
    title: A clue cannot help
    body:
      one: 1 mark on the board contradicts the answer, so there is nothing left for a clue to lead to. Rewinding takes moves back to the last board the puzzle can still be solved from. Close this and the mark that cannot be right stays lit on the grids, to sort out by hand.
      other: '{count} marks on the board contradict the answer, so there is nothing left for a clue to lead to. Rewinding takes moves back to the last board the puzzle can still be solved from. Close this and the marks that cannot be right stay lit on the grids, to sort out by hand.'
    rewind: Rewind
    leaveIt: Leave it to me

clue:
  # Read out for the clue itself, so a screen reader can find it.
  inPlay: Clue in play
  noneYet: Nobody has said anything yet…
  noneYetBody: Tap Next for the first clue.
  # Who is supposed to have said a clue. One is drawn from the puzzle's seed and
  # the clue's own number, so a clue keeps its line. {noun} is the theme's word
  # for one of its cast — diver, gardener, astronaut — and the lines that use it
  # sound like the puzzle rather than like a bystander.
  openers:
    - Someone commented that
    - An observer mentioned that
    - One {noun} remembered that
    - Another {noun} was sure that
    - Word went round that
    - It was noted at the time that
    - Somebody swore blind that
    - One {noun} let slip that
    - The record shows that
    - A bystander insisted that
    - Nobody disputes that
    - One {noun} recalled that
    - It is generally agreed that
    - Another {noun} put it that

item:
  # The heading over an item's traits on its card is the trait's own label, which
  # lives with the theme. Nothing else on the card is fixed wording.
  aboutHint: About {label}

briefings:
  # What went wrong, and why anybody wants it sorted out. Three per theme; the
  # puzzle's seed picks one and keeps it.
  #
  # A briefing must name no set except the anchor — which sets a puzzle plays
  # with is sampled from its theme, so a briefing promising a cargo manifest
  # would sometimes describe a puzzle with no cargo in it. A test holds every
  # line below to that. {noun} is the anchor's own word and is always safe.
  fallback:
    title: Nobody wrote it down
    body: Everything about this was recorded carefully, and then it was not. What is left is what people remember, said one piece at a time — and between them, if you are careful, it comes to exactly one answer.
  themes:
    cosmic:
      - title: The manifest took a walk
        body: The only printed copy of the flight paperwork was being read on the observation deck when somebody demonstrated the airlock. It is now in a slow orbit of its own, along with the pen. Nothing leaves the pad until every line of it has been put back, and the window closes on Thursday.
      - title: Filed by committee
        body: Three departments each kept their own records so that nothing could possibly go missing, and each department has since misplaced a different half of theirs. Between them they are certain of everything except which {noun} is on which flight. The rockets are fuelled and the crews are being polite about it.
      - title: The computer was very confident
        body: The scheduling system reconciled the roster overnight, congratulated itself, and assigned every {noun} to the same berth on the same flight. It cannot be persuaded to explain how. The engineers are working from the crew room whiteboard and whatever anyone can swear to.
    cafe:
      - title: The order pad met the mop bucket
        body: The morning rush was survived, the pad was set down on the wrong end of the counter, and the wrong end of the counter was where the bucket went over. The ink is a memory. The till has to balance by close, and until it does nobody knows who owes what.
      - title: The new machine ate everything
        body: The card reader was upgraded on Tuesday and has since forgotten Monday, Wednesday and the concept of a receipt. Every regular came in, every regular was served, and the record of it is a shrug. The owner is being extremely calm about this in a way that is worrying everybody.
      - title: A very helpful customer
        body: Somebody tidied the counter as a kindness, and in doing so squared up every scrap of paper on it into one beautiful pile in no order whatsoever. Everyone remembers their own morning perfectly and nobody remembers anyone else’s. The lunch shift starts in an hour.
    quest:
      - title: The bard has been embellishing
        body: The only account of the campaign is a ballad, and the ballad rhymes rather than reports. Every verse is true in some order, but the order is whichever one scanned. The guild will not pay out on a song, so somebody has to work out who actually did what.
      - title: The ledger was eaten
        body: The quest ledger was kept in a locked chest, guarded by something that was later persuaded the chest was food. What survives is the memory of a tavern full of witnesses, none of whom were sober and all of whom were there. Nothing gets paid out until the claims agree with each other.
      - title: Everyone tells it differently
        body: Everyone came back at once, everyone had done something worth telling, and every account begins with the word "obviously". They cannot all be right and none of them will go first. The guildmaster wants it settled before the drinks do it for him.
    reef:
      - title: The dive log went for a dive
        body: The log was on the transom, and then the swell was on the transom, and now the log is somewhere between the boat and the sea floor. Everyone surfaced happy and nobody wrote anything down. The permit needs the day’s numbers filed by Friday or the whole trip goes unrecorded.
      - title: Everything came off one line
        body: Somebody rinsed everything at once, hung it on one line, and left it to the wind to decide whose was whose. Every {noun} is certain what they saw and vague about what they wore. The insurance form asks for both.
      - title: The tender was rewriting history
        body: The boat tender kept the day’s notes on their hand, which then met a wave, sun cream and a towel in that order. What is left is four smudges and one word that might be "eel". The dive centre would like a version to pin on the board.
    garden:
      - title: The entry cards blew away
        body: The show marquee was open at both ends when the wind found it, and the entry cards left in a hurry. The entries are still on their benches, magnificent and entirely anonymous. Judging starts at two and the rosettes have to go to the right benches.
      - title: A very thorough watering
        body: The sprinkler was set on a timer by somebody who does not trust timers, and so was also set off by hand. The paperwork was under the sprinkler. Every {noun} knows exactly what they grew and has firm opinions about everyone else’s.
      - title: The judge is new
        body: This year’s judge reorganised the benches for a better light, which was thoughtful, and did it before the cards were checked, which was not. Nobody doubts the measurements; nobody can say whose they are. The blue ribbon is not going anywhere until this is straightened out.

